name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install -r requirements.txt
      # Los runners no tienen audio: se comprueba el import del backend y la calibración del DSP
      # (tono de 997 Hz a -20 dBFS en ambos canales -> -20 LUFS / -20 dBTP).
      - name: DSP
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import time
          import numpy as np
          import bridge
          d = bridge.Dsp(48000, 2)
          t = np.arange(48000 * 4) / 48000
          s = (0.1 * np.sin(2 * np.pi * 997 * t)).astype(np.float32)
          d.push(np.stack([s, s], 1).tobytes())
          d.ingest(d.pull())
          f = np.frombuffer(d.frame(time.time()), np.float32)
          print("LUFS M", f[2], "TP", f[6], "pico Hz", f[12])
          assert len(f) == bridge.FRAME_FLOATS
          assert abs(f[2] + 20) < 0.1 and abs(f[6] + 20) < 0.1 and abs(f[12] - 997) < 1
      - if: runner.os != 'Windows'
        run: python bridge.py --list-devices

  # Instalador de macOS de punta a punta en un Mac real: BlackHole como salida del sistema,
  # bridge arrancado por launchd, tono de −20 dBFS con afplay y lectura por WebSocket.
  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: BlackHole as system output
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          sleep 5
          SwitchAudioSource -a
          SwitchAudioSource -s "BlackHole 2ch"
      - run: bash install-macos.sh
      - name: Tone through the bridge
        run: |
          python -c "import numpy as n,wave;t=n.arange(48000*20)/48000;s=(0.1*n.sin(2*n.pi*997*t)*32767).astype('<i2');w=wave.open('tone.wav','wb');w.setnchannels(2);w.setsampwidth(2);w.setframerate(48000);w.writeframes(n.repeat(s,2).tobytes());w.close()" || { pip install -q numpy && python -c "import numpy as n,wave;t=n.arange(48000*20)/48000;s=(0.1*n.sin(2*n.pi*997*t)*32767).astype('<i2');w=wave.open('tone.wav','wb');w.setnchannels(2);w.setsampwidth(2);w.setframerate(48000);w.writeframes(n.repeat(s,2).tobytes());w.close()"; }
          afplay tone.wav & sleep 6
          APP="$HOME/Library/Application Support/MiniMetersBridge"
          "$APP/.venv/bin/python" "$APP/test_client.py" 3 | tee out.txt
          cat "$APP/bridge.log"
          python -c "import re,sys;m=float(re.search(r'LUFS M=(-?[\d.]+)',open('out.txt').read()).group(1));print('LUFS M',m);sys.exit(abs(m+20)>1)"
      - name: Uninstall
        run: |
          bash uninstall-macos.sh
          ! launchctl print "gui/$(id -u)/io.github.manuel-1312.minimeters-bridge" 2>/dev/null
          test ! -e "$HOME/Library/Application Support/MiniMetersBridge"
